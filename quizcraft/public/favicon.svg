<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Theme Brand Gradient (Violet to Fuchsia) -->
    <linearGradient id="brand-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <!-- Outer 'Q' Ring -->
  <circle cx="248" cy="240" r="130" fill="none" stroke="url(#brand-grad)" stroke-width="36" />
  
  <!-- The 'Q' Tail -->
  <path d="M 335 325 L 400 390" fill="none" stroke="url(#brand-grad)" stroke-width="36" stroke-linecap="round" />

  <!-- Inner Neural Network / Brain -->
  <g stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Network Connections (Lines) -->
    <path d="M 210 180 L 280 170 L 320 230 L 260 290 L 170 240 Z" fill="none" />
    <path d="M 210 180 L 250 230 L 320 230" fill="none" />
    <path d="M 170 240 L 250 230 L 260 290" fill="none" />
    <path d="M 280 170 L 250 230" fill="none" />
    
    <!-- Neural Nodes (Purple Gradient) -->
    <circle cx="210" cy="180" r="10" fill="url(#brand-grad)" stroke="none" />
    <circle cx="280" cy="170" r="12" fill="url(#brand-grad)" stroke="none" />
    <circle cx="320" cy="230" r="10" fill="url(#brand-grad)" stroke="none" />
    <circle cx="260" cy="290" r="14" fill="url(#brand-grad)" stroke="none" />
    <circle cx="170" cy="240" r="10" fill="url(#brand-grad)" stroke="none" />
    
    <!-- Central Brain Core -->
    <circle cx="250" cy="230" r="16" fill="url(#brand-grad)" stroke="none" />
  </g>
</svg>
